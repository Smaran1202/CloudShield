[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "cloudshield"
version = "0.1.0"
description = "AWS security platform: read-only discovery, findings, risk scores and attack paths."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi",
    "uvicorn",
    "pydantic-settings",
    "boto3",
    "sqlalchemy",
    "alembic",
    "httpx",
    "python-dotenv",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "ruff",
    "moto[ec2,iam,s3]",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
cloudshield = ["ai/knowledge/*.md", "db/migrations/script.py.mako"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B"]
